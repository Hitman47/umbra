[versions]
junit = "4.13.2"
agp = "8.13.2"
kotlin = "2.4.10"
compileSdk = "36"
minSdk = "29"
targetSdk = "36"
androidx-core-ktx = "1.18.0"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.9.4"
compose-bom = "2026.06.01"
libmpv = "1.0.0"
smbj = "0.15.0"
nanohttpd = "2.3.1"
# NFSv3 client, pure Java (the protocol test).
nfsclient = "1.1.0"
# smbj-rpc: lists the NAS shares (SRVSVC NetShareEnum).
dcerpc = "0.12.13"
# Coil 3.6+ pulls Compose 1.12, which needs AGP 9.1 / compileSdk 37.
coil = "3.5.0"
okhttp = "4.12.0"
kotlinx-serialization = "1.11.0"
# KSP2 versions are independent of the Kotlin version.
ksp = "2.3.12"
room = "2.8.5"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
libmpv = { module = "dev.jdtech.mpv:libmpv", version.ref = "libmpv" }
smbj = { module = "com.hierynomus:smbj", version.ref = "smbj" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nfsclient = { module = "com.emc.ecs:nfs-client", version.ref = "nfsclient" }
dcerpc = { module = "com.rapid7.client:dcerpc", version.ref = "dcerpc" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
