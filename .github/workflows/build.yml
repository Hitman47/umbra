name: Build

# Every push: the unit tests and a debug APK, so a broken build shows here
# before anyone installs it.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle settings for Linux
        # gradle.properties trusts the Windows certificate store (needed on the PC behind an antivirus): not here.
        run: |
          sed -i 's/ -Djavax.net.ssl.trustStoreType=Windows-ROOT//' gradle.properties
          chmod +x gradlew

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nyxara-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
