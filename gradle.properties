# Windows-ROOT: trust the Windows certificate store. Avast's HTTPS scanning
# re-signs traffic with its own root, which Windows trusts but the JDK's
# cacerts does not (PKIX errors -> "plugin was not found").
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
